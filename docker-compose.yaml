

services:
  # 1. MySQL Database Service
  db:
    image: mysql:8.4
    container_name: mysql-db
    restart: always
    environment:
      # Using root credentials as specified in your DATABASES dictionary
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. Django Application
  web:
    build: .
    image: adminadmin2/django-movie-app:latest
    container_name: movie-app
    restart: always
    expose:
      - "8000" # Expose internally for Nginx/Prometheus, not directly to host
    env_file:
      - .env
    volumes:
      # Removed SQLite volume; persisting static and media files
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
       db :
        condition: service_healthy

  # 3. Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web

  # 4. EC2 Host Monitoring
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - '/:/rootfs:ro'
      - '/sys:/sys:ro'

  # 5. Docker Container Monitoring
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    command:
      - "--docker_only=true"
      - "--disable_metrics=disk"
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    devices:
      - /dev/kmsg
  # 6. Prometheus Server
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - web
      - cadvisor

  # 7. Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  static_volume:
  media_volume:
  mysql_data: