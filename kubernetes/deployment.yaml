---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: movies-hub
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: movie-config
              key: DB_NAME
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: movie-secrets
              key: mysql-root-password
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-deployment
  namespace: movies-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
      - name: django
        image: adminadmin2/django-movie-app:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: movie-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: movie-secrets
              key: django-secret-key
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: movie-secrets
              key: mysql-root-password  