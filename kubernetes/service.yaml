---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: movies-hub
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: movies-hub
spec:
  selector:
    app: django
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000