# ... (keep your on: push/pull_request triggers the same) ...

jobs:

  # JOB 1: Django Testing
  test:
    name: Django Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        run: python manage.py check
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Run Django Tests
        run: python manage.py test
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}


  # JOB 2: Build and Push Docker Image
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    # Run Docker push only after a successful push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/django-movie-cicd
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
# JOB 3: Deploy to AWS EC2
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    
    # Run deployment only after a successful push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: SSH and Restart Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Pull the newest image
            docker pull adminadmin2/django-movie-cicd:latest
            
            # 2. Stop and remove the old container (ignoring errors if it doesn't exist)
            docker stop movie-app || true
            docker rm movie-app || true
            
            # 3. Run the new container with your verified command
            docker run -d \
              --name movie-app \
              --restart unless-stopped \
              --env-file /opt/movie-app/.env \
              -p 8000:8000 \
              adminadmin2/django-movie-cicd:latest