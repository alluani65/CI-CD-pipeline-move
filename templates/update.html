{% extends 'base.html' %}

{% block title %}Update Movie - Movies Hub{% endblock %}

{% block body %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg" style="background-color: #1e1e1e; border-color: #333;">
            <div class="card-header text-center" style="border-bottom: 1px solid #333;">
                <h3 class="font-weight-bold text-warning mb-0">Update Movie</h3>
            </div>
            <div class="card-body p-4">
                
                <!-- The 'custom-django-form' class allows us to style the raw {{ form.as_p }} output -->
                <form method="post" action="" enctype="multipart/form-data" class="custom-django-form text-light">
                    {% csrf_token %}
                    
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-warning btn-block font-weight-bold mt-4 py-2" style="font-size: 1.1rem;">Save Changes</button>
                </form>
                
            </div>
        </div>
    </div>
</div>

<!-- CSS to style the unclassed inputs generated by {{ form.as_p }} -->
<style>
    .custom-django-form p {
        margin-bottom: 1.5rem;
        font-weight: 600;
        color: #f8f9fa;
    }
    
    /* Target the text, number, and textarea inputs */
    .custom-django-form input[type="text"],
    .custom-django-form input[type="number"],
    .custom-django-form textarea {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        line-height: 1.5;
        color: #fff;
        background-color: #121212;
        border: 1px solid #444;
        border-radius: 0.25rem;
        margin-top: 0.5rem;
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }
    
    /* Highlight inputs in yellow when clicked/focused */
    .custom-django-form input:focus, 
    .custom-django-form textarea:focus {
        border-color: #f5c518;
        outline: 0;
        box-shadow: 0 0 0 0.2rem rgba(245, 197, 24, 0.25);
    }
    
    /* Style the file upload button and the "Currently: /media/..." link */
    .custom-django-form input[type="file"] {
        display: block;
        margin-top: 0.5rem;
        color: #a0a0a0;
    }
    
    .custom-django-form a {
        color: #f5c518;
        text-decoration: none;
    }
    
    .custom-django-form a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
