{% extends 'base.html' %}

{% block title %}Delete Movie - Movies Hub{% endblock %}

{% block body %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg text-center" style="background-color: #1e1e1e; border: 1px solid #ff4d4d;">
            <div class="card-body p-5">
                
                <h2 class="text-danger font-weight-bold mb-3">⚠️ Confirm Deletion</h2>
                
                <p class="text-light mb-4" style="font-size: 1.1rem;">
                    Are you absolutely sure you want to delete this movie? <br>
                    <span class="text-muted" style="font-size: 0.9rem;">This action cannot be undone.</span>
                </p>
                
                <!-- Removed enctype="multipart/form-data" as we are not uploading files here -->
                <form action="" method="post">
                    {% csrf_token %}
                    
                    <div class="d-flex justify-content-center mt-4">
                        <!-- Uses browser history to go back, or you can change the href to your home URL (e.g., href="/" ) -->
                        <a href="javascript:history.back()" class="btn btn-outline-light px-4 mr-3">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 font-weight-bold">Yes, Delete</button>
                    </div>
                </form>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
