{% extends 'base.html'%}
{% block body%}
<div class="container">
    <div class="row">
        {%for i in movie %}
    <div class="card mt-3 mr-3" style="width: 18rem;" >
  <img src="{{i.img.url}}" class="card-img-top" alt="..."width="250" height="250">
  <div class="card-body">
    <h5 class="card-title">{{i.name}}</h5>
    <p class="card-text">{{i.des}}</p>
    <a href="{%url 'movieapp:detail' i.id %}" class="btn btn-primary">{{i.name}}</a>
  </div>
</div>
    {%endfor%}
</div>
</div>

{%endblock%}
