{% extends 'base.html'%}
{% block body%}
<div class="container">
    <div class="row">
        <div class="col-md-6">
            <br>
<img src="{{movie.img.url}}" width="350" height="350">
        </div>
    </div>
        <div class="col-md-6">
        <h1>{{movie.name}}</h1><br>

        </div>
    </div>
</div>

{%endblock%}
